// desktop — Swing GUI + CLI(.exe로 패키징). core 의존.
apply plugin: 'application'

dependencies {
    implementation project(':core')
}

application {
    mainClass = 'mekicalc.ui.App'
}

// 엔진 회귀 검증(안전망): gradlew :desktop:selfTest
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'SelfTest 회귀 검증 실행'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mekicalc.Main'
    args = ['--selftest']
    workingDir = rootProject.projectDir   // data/ 실데이터 로드용
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
}

// 시뮬 진단(스킬별 DPS 기여 분해): gradlew :desktop:simDiag -Pjob=darkknight -Plv=140
tasks.register('simDiag', JavaExec) {
    group = 'verification'
    description = '신엔진 스킬별 DPS 기여 분해(값 변화 원인 추적)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mekicalc.SimDiag'
    workingDir = rootProject.projectDir
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
    if (project.hasProperty('job')) systemProperty 'job', project.property('job')
    if (project.hasProperty('lv')) systemProperty 'lv', project.property('lv')
}

// 실 프리셋 절대값 대조(전 직업, 조/경): gradlew :desktop:presetCompare
tasks.register('presetCompare', JavaExec) {
    group = 'verification'
    description = '활성 프리셋 스탯으로 전 직업 신엔진 절대 DPS(조/경)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mekicalc.PresetCompare'
    workingDir = rootProject.projectDir
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
    if (project.hasProperty('chapter')) systemProperty 'chapter', project.property('chapter')
}
