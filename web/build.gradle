// web — 웹 서버(Spring MVC: Controller + Service). core 의존.
// 정적 프론트는 public/, 게임 데이터는 data/ (런타임 외부 폴더).
// 실행: build-web.ps1(:web:installDist → java -cp lib/* mekicalc.web.boot.WebApplication).
plugins {
    id 'application'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

dependencies {
    implementation project(':core')
    // 런타임 JDBC 드라이버(기존 lib jar 유지, 버전 드리프트 방지)
    implementation files(rootProject.file('lib/postgresql.jar'))
    implementation 'org.springframework.boot:spring-boot-starter-web'
}

// Spring 진입점(bootJar/bootRun/installDist 공용). CLI 유틸은 mekicalc.web.AdminCli.
application {
    mainClass = 'mekicalc.web.boot.WebApplication'
}
