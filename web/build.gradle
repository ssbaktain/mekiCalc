// web — 웹 서버. core 의존. (Spring MVC는 다음 단계에서 이 모듈에 추가)
// 현재는 기존 JDK 내장 HttpServer(WebMain) 그대로 — 재구성 검증용.
apply plugin: 'application'

dependencies {
    implementation project(':core')
    // 런타임 JDBC 드라이버(기존 lib jar 유지, 버전 드리프트 방지)
    implementation files(rootProject.file('lib/postgresql.jar'))
}

application {
    mainClass = 'mekicalc.web.WebMain'
}

// 웹 서버 로컬 실행: gradlew :web:runWeb  (포트 8899, data/, public/)
tasks.register('runWeb', JavaExec) {
    group = 'application'
    description = '웹 서버를 로컬 8899로 실행'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mekicalc.web.WebMain'
    args = ['8899', rootProject.file('data').toString(), rootProject.file('public').toString()]
    workingDir = rootProject.projectDir
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
}
