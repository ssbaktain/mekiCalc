# 기본 포트(구 WebMain 기본과 동일). 실행 시 --server.port 로 덮어씀.
server.port=8080

# 정적 데이터/프론트 폴더(런타임 외부). StaticController·BeanConfig가 참조.
mekicalc.data-dir=data
mekicalc.web-dir=public

# Spring 기본 정적 리소스 핸들링·환영페이지 비활성 → 정적 서빙을 StaticController가 전담(구 서버 동작 재현).
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# 화이트라벨 에러 페이지 끔(404 등은 StaticController가 처리).
server.error.whitelabel.enabled=false

# 시작 배너 최소화(로그 노이즈 감소).
spring.main.banner-mode=off

# 관리자 게이팅 우회(로컬 개발 전용). 기본 false → 프로덕션은 반드시 화이트리스트 로그인.
# dev 프로파일(application-dev.properties)에서만 true로 켜서 로그인 없이 admin 화면을 확인한다.
mekicalc.dev-admin-bypass=false

# 제보/문의 첨부 업로드 한도. 1회 합계 논리 한도는 20MB(InquiryController에서 검사),
# 파싱 하드 한도는 약간 여유(22MB) — 그 사이 초과분은 컨트롤러가 친화적 413으로 응답.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
