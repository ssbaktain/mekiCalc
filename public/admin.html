<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - MekiCalc</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    .admin-wrap h1 { margin: 8px 0 4px; }
    .admin-sub { color: var(--muted, #8a94a6); margin: 0 0 24px; font-size: 14px; }
    .admin-card { border: 1px solid var(--border, #2a3140); border-radius: 12px;
      padding: 18px 20px; margin: 14px 0; background: var(--card, #171b24); }
    .admin-card h2 { margin: 0 0 8px; font-size: 17px; }
    .admin-card p { margin: 4px 0; color: var(--muted, #8a94a6); font-size: 14px; }
    .admin-card .soon { display: inline-block; margin-left: 8px; font-size: 12px;
      color: #ffb454; border: 1px solid #5a4a2a; border-radius: 999px; padding: 1px 8px; }
    .admin-actions a { display: inline-block; margin: 8px 12px 0 0; }
    .admin-top { display: flex; justify-content: space-between; align-items: center; }
    .admin-top .links a { margin-left: 14px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-top">
      <div>
        <h1>MekiCalc 관리자</h1>
        <p class="admin-sub">관리자 전용 페이지 · 일반 사용자에게는 노출되지 않습니다.</p>
      </div>
      <div class="links">
        <a href="/">← 메인</a>
        <a href="/auth/logout">로그아웃</a>
      </div>
    </div>

    <section class="admin-card">
      <h2>예상 데미지</h2>
      <p>일반 페이지에서는 추후 제거될 예정이며, 관리자는 계속 사용할 수 있습니다.</p>
      <div class="admin-actions">
        <a href="/">예상 데미지 계산기 열기 →</a>
      </div>
    </section>

    <section class="admin-card">
      <h2>카카오봇 관리 <span class="soon">준비 중</span></h2>
      <p>방별 권한(공지·리마인더 / 명령 응답), 개인 공지·테스트 발송을 관리합니다.</p>
      <p class="admin-sub" style="margin-top:10px">단계 2~5에서 채워집니다.</p>
    </section>
  </div>
</body>
</html>
