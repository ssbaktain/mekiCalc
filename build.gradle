// MekiCalc 멀티모듈 빌드 — 표준 3모듈(MVC 지향).
//   core    : 계산 도메인(Model) — engine/model/json/config, 의존성 없음
//   desktop : Swing .exe(View) — ui/Main/SelfTest, core 의존
//   web     : Spring MVC(Controller+Service) — web/, core 의존 (Spring은 이 모듈에만)
// 정적 프론트는 public/ 폴더(런타임 외부 서빙), 게임 데이터는 data/ 폴더.
subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
